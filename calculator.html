<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                to right,
                #4facfe,
                #00f2fe
            );
        }

        /* Calculator body */
        .calculator {
            width: 425px;
            padding: 25px;

            background: #222;
            border-radius: 18px;
        }

        /* Display */
        #display {
            width: 100%;
            height: 100px;

            margin-bottom: 18px;
            padding: 10px 15px;

            border: none;
            border-radius: 9px;

            background-color: #fff8f8;
            color: #111;

            font-size: 30px;
            text-align: right;

            outline: none;
        }

        /* Buttons layout */
        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        /* All buttons */
        button {
            height: 64px;

            border: none;
            border-radius: 10px;

            background-color: #eeeeee;
            color: #111;

            font-size: 23px;

            cursor: pointer;

            transition: 0.1s;
        }

        button:hover {
            opacity: 0.85;
        }

        button:active {
            transform: scale(0.96);
        }

        /* AC button */
        .clear {
            background-color: #ff0808;
            color: white;
        }

        /* Backspace */
        .backspace {
            background-color: #eeeeee;
            color: #111;
        }

        /* Operators */
        .operator {
            background-color: #ffa500;
            color: white;
        }

        /* Equal button */
        .equal {
            grid-column: span 2;

            background-color: #008f00;
            color: white;
        }

        /* Mobile */
        @media (max-width: 500px) {

            .calculator {
                width: 92%;
                padding: 18px;
            }

            #display {
                height: 85px;
                font-size: 26px;
            }

            .buttons {
                gap: 9px;
            }

            button {
                height: 58px;
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <!-- Display -->
        <input
            type="text"
            id="display"
            readonly
        >

        <!-- Calculator Buttons -->
        <div class="buttons">

            <!-- Row 1 -->
            <button class="clear" onclick="clearDisplay()">
                AC
            </button>

            <button class="backspace" onclick="backspace()">
                ⌫
            </button>

            <button class="operator" onclick="percentage()">
                %
            </button>

            <button class="operator" onclick="addValue('/')">
                /
            </button>


            <!-- Row 2 -->
            <button onclick="addValue('7')">
                7
            </button>

            <button onclick="addValue('8')">
                8
            </button>

            <button onclick="addValue('9')">
                9
            </button>

            <button class="operator" onclick="addValue('*')">
                *
            </button>


            <!-- Row 3 -->
            <button onclick="addValue('4')">
                4
            </button>

            <button onclick="addValue('5')">
                5
            </button>

            <button onclick="addValue('6')">
                6
            </button>

            <button class="operator" onclick="addValue('-')">
                -
            </button>


            <!-- Row 4 -->
            <button onclick="addValue('1')">
                1
            </button>

            <button onclick="addValue('2')">
                2
            </button>

            <button onclick="addValue('3')">
                3
            </button>

            <button class="operator" onclick="addValue('+')">
                +
            </button>


            <!-- Row 5 -->
            <button onclick="addValue('0')">
                0
            </button>

            <button onclick="addValue('.')">
                .
            </button>

            <button class="equal" onclick="calculate()">
                =
            </button>

        </div>
    </div>


    <script>

        let display = document.getElementById("display");


        // Add number/operator to display
        function addValue(value) {

            display.value += value;

        }


        // Clear calculator
        function clearDisplay() {

            display.value = "";

        }


        // Backspace
        function backspace() {

            display.value =
                display.value.slice(0, -1);

        }


        // Percentage
        function percentage() {

            if (display.value !== "") {

                let value =
                    parseFloat(display.value);

                display.value =
                    value / 100;

            }

        }


        // Calculate result
        function calculate() {

            try {

                if (display.value === "") {
                    return;
                }

                let expression =
                    display.value;

                // Only allow calculator characters
                if (!/^[0-9+\-*/.() ]+$/.test(expression)) {
                    throw new Error();
                }

                let result =
                    Function(
                        '"use strict"; return (' +
                        expression +
                        ')'
                    )();

                if (!Number.isFinite(result)) {
                    throw new Error();
                }

                display.value = result;

            }

            catch {

                display.value = "Error";

                setTimeout(function () {
                    display.value = "";
                }, 1000);

            }

        }

    </script>

</body>
</html>
